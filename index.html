<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Interval Walking</title>
  <style>
    :root {
      --speed: #f97316;   /* orange */
      --regular: #38bdf8; /* blue   */
      --done: #22c55e;    /* green  */
      --idle: #64748b;    /* slate  */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) 20px calc(env(safe-area-inset-bottom) + 16px);
      text-align: center;
      transition: background 0.5s ease;
      overflow: hidden;
    }
    body.speed   { background: #2a1206; }
    body.regular { background: #061826; }
    body.done    { background: #052310; }

    header { padding-top: 18px; }
    h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #94a3b8; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 18px;
    }

    #phase {
      font-size: clamp(1.4rem, 6.5vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--idle);
      transition: color 0.4s ease;
    }
    body.speed   #phase { color: var(--speed); }
    body.regular #phase { color: var(--regular); }
    body.done    #phase { color: var(--done); }

    #time {
      font-size: clamp(3rem, 15vw, 4.5rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -0.01em;
    }

    #cycle { font-size: 1.1rem; color: #cbd5e1; font-weight: 600; min-height: 1.4em; }
    #total { font-size: 0.95rem; color: #64748b; }

    .ring {
      position: relative;
      width: min(72vw, 300px);
      height: min(72vw, 300px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 7; }
    .ring .progress {
      fill: none; stroke: var(--idle); stroke-width: 7; stroke-linecap: round;
      transition: stroke 0.4s ease, stroke-dashoffset 0.25s linear;
    }
    body.speed   .ring .progress { stroke: var(--speed); }
    body.regular .ring .progress { stroke: var(--regular); }
    body.done    .ring .progress { stroke: var(--done); }
    .ring .inner { display: flex; flex-direction: column; align-items: center; }

    .controls { display: flex; gap: 14px; width: 100%; max-width: 420px; }
    button {
      flex: 1;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 18px 12px;
      border: none;
      border-radius: 16px;
      color: #fff;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.2s ease, background 0.2s ease;
      user-select: none;
    }
    button:active { transform: scale(0.96); }
    #startBtn { background: #22c55e; }
    #startBtn.running { background: #eab308; }
    #resetBtn { background: #334155; }
    button:disabled { opacity: 0.4; cursor: default; }

    footer { font-size: 0.8rem; color: #475569; padding-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Interval Walking</h1>
  </header>

  <main>
    <div id="phase">Ready</div>
    <div class="ring">
      <svg viewBox="0 0 120 120">
        <circle class="track" cx="60" cy="60" r="56" />
        <circle class="progress" id="progress" cx="60" cy="60" r="56" />
      </svg>
      <div class="inner">
        <div id="time">03:00</div>
      </div>
    </div>
    <div id="cycle">Press Start</div>
    <div id="total">Total workout: 30:00</div>
  </main>

  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="resetBtn" disabled>Reset</button>
  </div>

  <footer>Speed walk 3 min · Regular walk 3 min · 5 rounds</footer>

  <script>
    // ---- Workout definition -------------------------------------------------
    const PHASE_SECONDS = 3 * 60;   // 3 minutes per phase
    const ROUNDS = 5;               // 5 rounds → 30 minutes total

    // Build the sequence: each round = Speed walk then Regular walk.
    const SEQUENCE = [];
    for (let r = 1; r <= ROUNDS; r++) {
      SEQUENCE.push({ name: "Speed Walk",   cls: "speed",   round: r });
      SEQUENCE.push({ name: "Regular Walk", cls: "regular", round: r });
    }
    const TOTAL_SECONDS = SEQUENCE.length * PHASE_SECONDS;

    // ---- State --------------------------------------------------------------
    let stepIndex = 0;          // index into SEQUENCE
    let remaining = PHASE_SECONDS;
    let running = false;
    let ticker = null;
    let wakeLock = null;
    const CIRC = 2 * Math.PI * 56; // ring circumference

    // ---- Elements -----------------------------------------------------------
    const body      = document.body;
    const phaseEl   = document.getElementById("phase");
    const timeEl    = document.getElementById("time");
    const cycleEl   = document.getElementById("cycle");
    const totalEl   = document.getElementById("total");
    const progress  = document.getElementById("progress");
    const startBtn  = document.getElementById("startBtn");
    const resetBtn  = document.getElementById("resetBtn");

    progress.style.strokeDasharray = CIRC;
    progress.style.strokeDashoffset = 0;

    // ---- Sound (Web Audio – beeps without any audio files) ------------------
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    }
    function beep(freq, duration, when = 0, vol = 0.25) {
      if (!audioCtx) return;
      const t = audioCtx.currentTime + when;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(vol, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + duration + 0.02);
    }
    function vibrate(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }
    // Cue at the start of a phase: high tone for speed, low for regular.
    function phaseCue(cls) {
      ensureAudio();
      if (cls === "speed") {
        beep(880, 0.18, 0);
        beep(1175, 0.22, 0.2);
        vibrate([200, 80, 200]);
      } else {
        beep(523, 0.25, 0);
        vibrate(200);
      }
    }
    function countdownCue() {            // last 3 seconds of a phase
      ensureAudio();
      beep(660, 0.12, 0, 0.18);
      vibrate(60);
    }
    function finishCue() {
      ensureAudio();
      beep(523, 0.2, 0);
      beep(659, 0.2, 0.22);
      beep(784, 0.4, 0.44);
      vibrate([300, 120, 300, 120, 500]);
    }

    // ---- Wake lock (keep phone screen on) -----------------------------------
    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator) {
          wakeLock = await navigator.wakeLock.request("screen");
        }
      } catch (e) { /* ignore – not critical */ }
    }
    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    }
    document.addEventListener("visibilitychange", () => {
      if (running && document.visibilityState === "visible") requestWakeLock();
    });

    // ---- Display ------------------------------------------------------------
    function fmt(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
    }
    function elapsedSeconds() {
      return stepIndex * PHASE_SECONDS + (PHASE_SECONDS - remaining);
    }
    function render() {
      const step = SEQUENCE[stepIndex];
      timeEl.textContent = fmt(remaining);
      phaseEl.textContent = step.name;
      cycleEl.textContent = "Round " + step.round + " of " + ROUNDS;
      body.classList.remove("speed", "regular", "done");
      body.classList.add(step.cls);
      const frac = remaining / PHASE_SECONDS;
      progress.style.strokeDashoffset = CIRC * (1 - frac);
      const left = TOTAL_SECONDS - elapsedSeconds();
      totalEl.textContent = "Remaining: " + fmt(Math.max(0, left));
    }

    function showDone() {
      body.classList.remove("speed", "regular");
      body.classList.add("done");
      phaseEl.textContent = "Complete!";
      timeEl.textContent = "00:00";
      cycleEl.textContent = "Great work 🎉";
      totalEl.textContent = "Total workout: 30:00";
      progress.style.strokeDashoffset = 0;
    }

    // ---- Timer loop ---------------------------------------------------------
    function tick() {
      remaining -= 1;
      if (remaining > 0) {
        if (remaining <= 3) countdownCue();
        render();
        return;
      }
      // Phase finished – advance.
      stepIndex += 1;
      if (stepIndex >= SEQUENCE.length) {
        stop(true);
        showDone();
        finishCue();
        return;
      }
      remaining = PHASE_SECONDS;
      render();
      phaseCue(SEQUENCE[stepIndex].cls);
    }

    // ---- Controls -----------------------------------------------------------
    function start() {
      ensureAudio();
      // Fresh start from a completed/idle state.
      if (stepIndex >= SEQUENCE.length) reset();
      running = true;
      startBtn.textContent = "Pause";
      startBtn.classList.add("running");
      resetBtn.disabled = false;
      requestWakeLock();
      render();
      phaseCue(SEQUENCE[stepIndex].cls);
      ticker = setInterval(tick, 1000);
    }
    function pause() {
      running = false;
      clearInterval(ticker);
      ticker = null;
      startBtn.textContent = "Resume";
      startBtn.classList.remove("running");
      releaseWakeLock();
    }
    function stop(finished) {
      running = false;
      clearInterval(ticker);
      ticker = null;
      startBtn.textContent = finished ? "Start Again" : "Start";
      startBtn.classList.remove("running");
      releaseWakeLock();
    }
    function reset() {
      stop(false);
      stepIndex = 0;
      remaining = PHASE_SECONDS;
      resetBtn.disabled = true;
      startBtn.textContent = "Start";
      body.classList.remove("speed", "regular", "done");
      phaseEl.textContent = "Ready";
      timeEl.textContent = fmt(PHASE_SECONDS);
      cycleEl.textContent = "Press Start";
      totalEl.textContent = "Total workout: " + fmt(TOTAL_SECONDS);
      progress.style.strokeDashoffset = 0;
    }

    startBtn.addEventListener("click", () => {
      if (running) pause();
      else start();
    });
    resetBtn.addEventListener("click", reset);

    // Initialise display.
    reset();
  </script>
</body>
</html>
