<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Re-RPG: a roguelike RPG for your phone, played in landscape." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>Re-RPG</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0f1a; --fg: #e6e9f2; --muted: #8b93a7; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); overscroll-behavior: none; }
    body {
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      user-select: none; -webkit-user-select: none; touch-action: none;
    }
    #game { position: fixed; inset: 0; display: grid; place-items: center; }
    #game canvas { display: block; touch-action: none; image-rendering: pixelated; }

    /* Portrait overlay: browsers can't force landscape outside fullscreen, so ask. */
    #rotate {
      position: fixed; inset: 0; z-index: 50; display: none; place-items: center; text-align: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: var(--bg);
    }
    #rotate .phone {
      width: 36px; height: 64px; margin: 0 auto 18px; border: 3px solid var(--fg); border-radius: 8px;
      animation: turn 1.6s ease-in-out infinite;
    }
    @keyframes turn { 0%, 30% { transform: rotate(0) } 60%, 100% { transform: rotate(-90deg) } }
    #rotate p { color: var(--muted); margin-top: 6px; }
    @media (orientation: portrait) { #rotate { display: grid; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate" aria-live="polite">
    <div>
      <div class="phone"></div>
      <strong>Rotate your phone</strong>
      <p>Re-RPG is played in landscape.</p>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
