<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>Re-RPG card editor</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0f1a; --panel: #141a2b; --edge: #2a3350; --fg: #e6e9f2; --muted: #8b93a7; --gold: #e0c060; --red: #ff6b6b; --green: #3fbf7a; --blue: #7dd3fc; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { padding: max(10px, env(safe-area-inset-top)) 12px max(24px, env(safe-area-inset-bottom)); max-width: 980px; margin: 0 auto; }
    h1 { font-size: 18px; margin: 4px 0 8px; }
    h2 { font-size: 15px; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 10px; }
    .bar label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    input, select, textarea, button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 10px; min-height: 40px; }
    input[type=number] { width: 86px; }
    input[type=checkbox] { min-height: 0; width: 22px; height: 22px; }
    button { cursor: pointer; }
    button.primary { background: #1f2a44; border-color: var(--gold); color: var(--gold); font-weight: 600; }
    button.danger { border-color: var(--red); color: var(--red); }
    .tabs { display: flex; gap: 6px; margin: 8px 0; }
    .tabs button[aria-selected=true] { border-color: var(--gold); color: var(--gold); }
    .list { display: grid; gap: 6px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
    .row.ro { opacity: .55; cursor: default; }
    .row .name { font-weight: 600; }
    .row .sum { color: var(--muted); font-size: 13px; grid-column: 1 / -1; }
    .row .num { color: var(--gold); font-weight: 700; font-size: 18px; text-align: right; }
    .form { background: var(--panel); border: 1px solid var(--gold); border-radius: 12px; padding: 12px; margin: 8px 0 14px; display: grid; gap: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 10px; }
    .grid label, .form > label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips label { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--edge); border-radius: 20px; padding: 6px 10px; font-size: 13px; color: var(--fg); }
    .calc { font-size: 14px; color: var(--blue); }
    .text { font-size: 13px; color: var(--muted); font-style: italic; }
    .problems { background: #3a1518; border: 1px solid var(--red); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin: 8px 0; white-space: pre-line; }
    .ok { color: var(--green); font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .muted { color: var(--muted); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td, th { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--edge); vertical-align: top; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/editor/main.ts"></script>
</body>
</html>
