name: re-rpg

on:
  push:
    branches: [main, 'claude/**']
    paths: ['re-rpg/**', '.github/workflows/re-rpg.yml']
  pull_request:
    paths: ['re-rpg/**', '.github/workflows/re-rpg.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: re-rpg

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: re-rpg/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: re-rpg/dist

  pages:
    # Public test build: https://brucemccoy75-dev.github.io/Mobile/
    # Publishes dist/ to the gh-pages branch, which GitHub Pages already serves from.
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: re-rpg/dist
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: re-rpg/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy re-rpg ${{ github.sha }}"

  deploy:
    # Firebase Hosting: pushes to main only. Needs the FIREBASE_SERVICE_ACCOUNT secret
    # and FIREBASE_PROJECT_ID variable (see docs/FIREBASE_SETUP.md; the job is skipped until then).
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: re-rpg/dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: re-rpg
